<!DOCTYPE html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Қаржылық сауаттылық — шығын трекері</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            boxShadow: {
              soft: "0 18px 50px -24px rgb(15 23 42 / 0.35)",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="page-enter min-h-screen bg-stone-100 text-slate-800 antialiased transition-colors duration-500 dark:bg-zinc-950 dark:text-zinc-100"
  >
    <div class="pointer-events-none fixed inset-0 overflow-hidden">
      <div
        class="absolute -left-24 -top-24 h-72 w-72 rounded-full bg-emerald-400/25 blur-3xl dark:bg-emerald-600/15"
      ></div>
      <div
        class="absolute -bottom-24 -right-16 h-80 w-80 rounded-full bg-sky-300/25 blur-3xl dark:bg-cyan-500/10"
      ></div>
    </div>

    <main class="relative mx-auto max-w-6xl px-4 py-10 sm:py-14">
      <header class="mb-8 flex flex-wrap items-start justify-between gap-4">
        <div>
          <a
            href="index.html"
            class="text-sm text-emerald-600 transition hover:underline dark:text-emerald-400"
          >
            ← Әдет трекері / Трекер привычек
          </a>
          <p class="mt-3 text-sm font-medium uppercase tracking-[0.22em] text-emerald-600 dark:text-emerald-400">
            Теңге · ₸
          </p>
          <h1 class="mt-1 text-3xl font-semibold tracking-tight sm:text-4xl">
            Қаржылық сауаттылық
          </h1>
          <p class="text-sm text-slate-500 dark:text-zinc-400">Финансовая грамотность</p>
        </div>
        <button
          id="theme-toggle"
          type="button"
          class="shrink-0 rounded-2xl border border-slate-200/80 bg-white/70 px-3 py-2 text-sm font-medium shadow-soft backdrop-blur transition hover:-translate-y-0.5 dark:border-zinc-800 dark:bg-zinc-900/70"
        >
          <span id="theme-label">Ашық</span>
        </button>
      </header>

      <section class="mb-8 grid gap-4 lg:grid-cols-3" id="month-stats"></section>

      <div class="grid items-start gap-6 lg:grid-cols-[minmax(0,1fr)_360px]">
        <div class="space-y-6">
          <section
            class="rounded-3xl border border-white/70 bg-white/80 p-5 shadow-soft backdrop-blur dark:border-zinc-800 dark:bg-zinc-900/70"
          >
            <h2 class="text-lg font-semibold">Шығын трекері</h2>
            <p class="text-sm text-slate-500 dark:text-zinc-400">Трекер расходов · барлығы теңгемен</p>

            <form id="money-form" class="mt-4 grid gap-3 sm:grid-cols-2">
              <label class="text-sm sm:col-span-2">
                Атауы / Название
                <input
                  id="money-title"
                  required
                  maxlength="60"
                  placeholder="Мысалы: Азық-түлік / Продукты"
                  class="mt-1 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-200/70 dark:border-zinc-700 dark:bg-zinc-950"
                />
              </label>
              <label class="text-sm">
                Сома, ₸ / Сумма
                <input
                  id="money-amount"
                  type="number"
                  min="1"
                  step="1"
                  required
                  placeholder="15000"
                  class="mt-1 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-200/70 dark:border-zinc-700 dark:bg-zinc-950"
                />
              </label>
              <label class="text-sm">
                Түрі / Тип
                <select
                  id="money-type"
                  class="mt-1 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-emerald-400 dark:border-zinc-700 dark:bg-zinc-950"
                >
                  <option value="expense">Шығын / Расход</option>
                  <option value="income">Кіріс / Доход</option>
                </select>
              </label>
              <label class="text-sm sm:col-span-2">
                Санат / Категория
                <select
                  id="money-category"
                  class="mt-1 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-emerald-400 dark:border-zinc-700 dark:bg-zinc-950"
                ></select>
              </label>
              <button
                type="submit"
                class="rounded-2xl bg-emerald-600 px-5 py-3 text-sm font-semibold text-white shadow-soft transition hover:-translate-y-0.5 hover:bg-emerald-500 sm:col-span-2"
              >
                Жазу / Сохранить
              </button>
            </form>
          </section>

          <section id="tx-list" class="space-y-3"></section>
        </div>

        <aside class="space-y-4 lg:sticky lg:top-8">
          <section
            class="rounded-3xl border border-white/70 bg-white/80 p-5 shadow-soft backdrop-blur dark:border-zinc-800 dark:bg-zinc-900/70"
          >
            <h2 class="text-lg font-semibold">Айлық кіріс, ₸</h2>
            <p class="text-xs text-slate-500 dark:text-zinc-400">Месячный доход для расчёта плана</p>
            <input
              id="income-plan"
              type="number"
              min="0"
              step="1000"
              placeholder="300000"
              class="mt-3 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-emerald-400 dark:border-zinc-700 dark:bg-zinc-950"
            />
            <div id="plan-bars" class="mt-4 space-y-3"></div>
          </section>

          <section
            class="rounded-3xl border border-white/70 bg-white/80 p-5 shadow-soft backdrop-blur dark:border-zinc-800 dark:bg-zinc-900/70"
          >
            <h2 class="text-lg font-semibold">Курс: ақшаны бөлу</h2>
            <p class="text-xs text-slate-500 dark:text-zinc-400">Курс: как распределять деньги</p>
            <div id="course-list" class="mt-4 space-y-3"></div>
          </section>
        </aside>
      </div>
    </main>

    <script src="finance.js"></script>
  </body>
</html>
